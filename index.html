<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edge Dash</title>
<link rel="stylesheet" href="base.css">
<script>
  // Theme = themes/<name>/{theme.css, scene.svg, theme.json}. Chosen with ?theme=<name>
  // (the kiosk passes --theme through). See THEMES.md.
  const PARAMS = new URLSearchParams(location.search);
  const cleanName = n => String(n || "").replace(/[^a-z0-9_-]/gi, "");
  const DEFAULT_THEME = cleanName(PARAMS.get("theme")) || "tokyo";   // what --theme / install.sh set
  let stored = null;
  try {
    const set = PARAMS.get("settheme");                                   // --set-theme=NAME|default
    if (set === "default") localStorage.removeItem("edge-dash.theme");
    else if (set) localStorage.setItem("edge-dash.theme", cleanName(set));
    stored = cleanName(localStorage.getItem("edge-dash.theme"));
  } catch (_) {}
  let THEME = stored || DEFAULT_THEME;                                  // a choice made on the panel wins
  document.write(`<link id="themecss" rel="stylesheet" href="themes/${THEME}/theme.css">`);
</script>
</head>
<body>
  <div id="scene"></div>
  <div id="particles"></div>

  <section id="clock">
    <div id="time">
      <span id="hh">--</span><span class="colon">:</span><span id="mm">--</span>
      <span id="secs">--</span>
    </div>
    <div id="date"></div>
    <div id="sub"></div>
  </section>

  <aside id="sched" aria-hidden="true">
    <div class="head"><span class="dow"></span><span class="dt"></span></div>
    <div class="list"></div>
    <div class="foot"></div>
  </aside>

  <section id="cal">
    <div id="calhead"><div id="month"></div><div id="year"></div></div>
    <div id="grid"></div>
  </section>

  <!-- hidden touchpoint (top-left corner) opens the theme picker -->
  <div id="corner" aria-hidden="true"></div>
  <div id="picker" aria-hidden="true">
    <div class="box">
      <div class="head"><span class="title">Theme</span><button class="close" type="button">Close</button></div>
      <div class="list"></div>
      <div class="foot"><button class="reset" type="button">Use installed default</button><span class="hint"></span></div>
    </div>
  </div>

<script>
  // ---- settings ----
  const WEEK_START = 0;                       // 0 = Sunday, 1 = Monday
  const MIN_WEEKS = 5;                        // at least this many week rows (6 when the month needs it)
  const SHOW_PREV_MONTH = true;               // false: leading cells before the 1st stay blank
  const SCHEDULE_REFRESH_MS = 5 * 60 * 1000;  // how often to re-read schedule.json
  const MAX_EVENTS_SHOWN = 6;                 // rows in the held-day panel before "+N more"

  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const DOW_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const MON_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const esc = str => String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const sameDay = (a, b) => isoDay(a) === isoDay(b);
  const hhmm = iso => iso.slice(11, 16);

  // Local files over XHR: Chromium refuses fetch() on file:// but QtWebEngine allows XHR.
  function getLocal(path, onload, onerror) {
    const x = new XMLHttpRequest();
    x.open("GET", `${path}?ts=${Date.now()}`);
    x.onload = () => (x.status === 0 || x.status === 200) ? onload(x.responseText) : onerror && onerror();
    x.onerror = () => onerror && onerror();
    x.send();
  }

  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }
  const dayOfYear = d => Math.floor((d - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1;

  // ---- schedule data (written by fetch_schedule.py) ----
  let schedule = { days: {}, calendars: [], generated: null };
  function loadSchedule() {
    getLocal("schedule.json", text => {
      try { schedule = JSON.parse(text); renderedFor = null; renderCalendar(new Date()); }
      catch (e) { console.warn("schedule.json unreadable", e); }
    }, () => console.warn("schedule.json not found yet"));
  }

  // ---- calendar ----
  let renderedFor = null;
  function renderCalendar(today) {
    const y = today.getFullYear(), m = today.getMonth();
    const key = isoDay(today);
    if (renderedFor === key) return;
    renderedFor = key;

    $("month").textContent = MONTHS[m];
    $("year").textContent = y;

    const first = new Date(y, m, 1);
    const offset = (first.getDay() - WEEK_START + 7) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const weeks = Math.max(MIN_WEEKS, Math.ceil((offset + daysInMonth) / 7));
    const start = new Date(y, m, 1 - offset);

    const grid = $("grid");
    grid.innerHTML = "";
    grid.style.gridTemplateRows = `56px repeat(${weeks}, 1fr)`;

    for (let i = 0; i < 7; i++) {
      const dd = (WEEK_START + i) % 7;
      const h = document.createElement("div");
      h.className = "dow" + (dd === 0 || dd === 6 ? " wkend" : "");
      h.textContent = DOW[dd];
      grid.appendChild(h);
    }

    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const cell = document.createElement("div");
      if (!SHOW_PREV_MONTH && d < first) {          // leading padding: keep the grid slot, show nothing
        cell.className = "day blank";
        grid.appendChild(cell);
        continue;
      }
      const classes = ["day"];
      const dow = d.getDay();
      if (dow === 0 || dow === 6) classes.push("weekend");
      if (d.getMonth() !== m) classes.push("other");
      if (sameDay(d, today)) classes.push("today");
      else if (d < today) classes.push("past");
      cell.className = classes.join(" ");
      cell.textContent = d.getDate();
      cell.dataset.date = isoDay(d);

      // label the 1st of the following month; the leading days obviously belong to last month
      if (d > first && d.getMonth() !== m && d.getDate() === 1) {
        const tag = document.createElement("span");
        tag.className = "m";
        tag.textContent = MON_SHORT[d.getMonth()];
        cell.appendChild(tag);
      }

      const evs = schedule.days[cell.dataset.date] || [];
      if (evs.length) {
        const dots = document.createElement("span");
        dots.className = "dots";
        const seen = [];
        for (const ev of evs) { if (!seen.includes(ev.color)) seen.push(ev.color); if (seen.length === 4) break; }
        for (const c of seen) { const i = document.createElement("i"); i.style.background = c; dots.appendChild(i); }
        cell.appendChild(dots);
      }
      grid.appendChild(cell);
    }
  }

  // ---- clock ----
  function tick() {
    const now = new Date();
    $("hh").textContent = pad(now.getHours());
    $("mm").textContent = pad(now.getMinutes());
    $("secs").textContent = pad(now.getSeconds());
    document.querySelector("#time .colon").classList.toggle("off", now.getMilliseconds() >= 500);
    $("date").innerHTML = `<b>${DOW_LONG[now.getDay()]}</b>, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
    $("sub").textContent = `WEEK ${pad(isoWeek(now))}  ·  DAY ${dayOfYear(now)}  ·  ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;
    renderCalendar(now);
    setTimeout(tick, 500 - (now.getMilliseconds() % 500));
  }

  // ---- press-and-hold day schedule ----
  const sched = $("sched");
  function showSchedule(key) {
    const [y, m, d] = key.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    sched.querySelector(".dow").textContent = DOW_LONG[date.getDay()];
    sched.querySelector(".dt").textContent = `${d} ${MONTHS[m - 1]} ${y}`;
    const list = sched.querySelector(".list");
    list.innerHTML = "";
    const evs = schedule.days[key] || [];
    if (!evs.length) {
      list.innerHTML = `<div class="empty">Nothing scheduled</div>`;
    } else {
      for (const ev of evs.slice(0, MAX_EVENTS_SHOWN)) {
        const row = document.createElement("div");
        row.className = "ev";
        const cal = esc(ev.calendar.toUpperCase());
        const when = ev.allDay
          ? `<div class="when">All day<small>${cal}</small></div>`
          : `<div class="when">${hhmm(ev.start)} – ${hhmm(ev.end)}<small>${cal}</small></div>`;
        row.innerHTML = `${when}<div class="bar" style="background:${esc(ev.color)}"></div>` +
          `<div class="what">${esc(ev.title)}${ev.location ? `<small>${esc(ev.location)}</small>` : ""}</div>`;
        list.appendChild(row);
      }
      if (evs.length > MAX_EVENTS_SHOWN) list.insertAdjacentHTML("beforeend", `<div class="more">+${evs.length - MAX_EVENTS_SHOWN} more</div>`);
    }
    sched.querySelector(".foot").textContent = schedule.generated
      ? `${evs.length} event${evs.length === 1 ? "" : "s"}  ·  updated ${hhmm(schedule.generated)}`
      : "no schedule data yet";
    sched.classList.add("show");
    document.body.classList.add("holding");
  }
  function hideSchedule() {
    sched.classList.remove("show");
    document.body.classList.remove("holding");
    document.querySelectorAll("#grid .day.held").forEach(el => el.classList.remove("held"));
  }

  const grid = $("grid");
  grid.addEventListener("pointerdown", e => {
    const cell = e.target.closest(".day");
    if (!cell || !cell.dataset.date) return;
    e.preventDefault();
    cell.classList.add("held");
    try { cell.setPointerCapture(e.pointerId); } catch (_) {}
    showSchedule(cell.dataset.date);
  });
  const RELEASE = ["pointerup", "pointercancel", "lostpointercapture"];
  for (const t of RELEASE) grid.addEventListener(t, hideSchedule);
  window.addEventListener("blur", hideSchedule);

  // ?hold=YYYY-MM-DD pins the panel open (used for screenshots)
  const pinned = PARAMS.get("hold");
  if (pinned) {
    for (const t of RELEASE) grid.removeEventListener(t, hideSchedule);
    window.removeEventListener("blur", hideSchedule);
    const pin = () => schedule.generated ? showSchedule(pinned) : setTimeout(pin, 300);
    pin();
  }

  // ---- theme: scene + particles (re-runnable, so the picker can switch live) ----
  function applyTheme(name) {
    THEME = name;
    $("themecss").href = `themes/${name}/theme.css`;
    $("scene").innerHTML = "";
    $("particles").innerHTML = "";
    getLocal(`themes/${name}/scene.svg`, svg => { if (THEME === name) $("scene").innerHTML = svg; }, () => {});
    getLocal(`themes/${name}/theme.json`, text => {
      try { if (THEME === name) spawnParticles(JSON.parse(text).particles || {}); } catch (e) { console.warn("theme.json unreadable", e); }
    }, () => {});
  }

  // ---- theme picker: tap the hidden top-left corner ----
  const picker = $("picker");
  let themes = [], pickerTimer = null;
  getLocal("themes/themes.json", text => {
    try { themes = JSON.parse(text).themes || []; } catch (_) { themes = [THEME]; }
    themes.forEach(t => getLocal(`themes/${t}/theme.json`, j => {
      try { const d = JSON.parse(j); themeMeta[t] = { name: d.name || t, swatch: d.swatch || [] }; } catch (_) {}
    }, () => {}));
  }, () => { themes = [THEME]; });
  const themeMeta = {};

  function openPicker() {
    const list = picker.querySelector(".list");
    list.innerHTML = "";
    for (const t of themes) {
      const m = themeMeta[t] || { name: t, swatch: [] };
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tb" + (t === THEME ? " on" : "");
      b.dataset.theme = t;
      b.innerHTML = `<span class="sw">${m.swatch.map(c => `<i style="background:${esc(c)}"></i>`).join("")}</span>` +
                    `<span class="nm">${esc(m.name)}</span>` + (t === DEFAULT_THEME ? `<span class="def">default</span>` : "");
      list.appendChild(b);
    }
    picker.querySelector(".hint").textContent = stored ? `panel choice: ${themeMeta[stored]?.name || stored}` : "using installed default";
    picker.classList.add("show");
    armPickerTimeout();
  }
  function closePicker() { picker.classList.remove("show"); clearTimeout(pickerTimer); }
  function armPickerTimeout() { clearTimeout(pickerTimer); pickerTimer = setTimeout(closePicker, 20000); }

  // a tap (press + release without dragging) on the corner opens it
  let cornerDown = null;
  $("corner").addEventListener("pointerdown", e => { cornerDown = [e.clientX, e.clientY]; });
  $("corner").addEventListener("pointerup", e => {
    if (cornerDown && Math.hypot(e.clientX - cornerDown[0], e.clientY - cornerDown[1]) < 24) openPicker();
    cornerDown = null;
  });
  picker.addEventListener("click", e => {
    armPickerTimeout();
    const tb = e.target.closest(".tb");
    if (tb) {
      stored = tb.dataset.theme;
      try { localStorage.setItem("edge-dash.theme", stored); } catch (_) {}
      applyTheme(stored);
      openPicker();                                 // re-render with the new selection
      return;
    }
    if (e.target.closest(".reset")) {
      stored = null;
      try { localStorage.removeItem("edge-dash.theme"); } catch (_) {}
      applyTheme(DEFAULT_THEME);
      openPicker();
      return;
    }
    if (e.target.closest(".close") || e.target === picker) closePicker();
  });

  applyTheme(THEME);
  if (PARAMS.get("picker")) setTimeout(openPicker, 1500);   // ?picker=1 opens it on load (screenshots)

  const rnd = (a, b) => a + Math.random() * (b - a);
  function spawnParticles(p) {
    const n = p.count | 0;
    if (!n || !p.path) return;
    const host = $("particles");
    const colors = p.colors && p.colors.length ? p.colors : [["#ffffff", "none"]];
    const size = p.size || [18, 40], op = p.opacity || [0.45, 0.85];
    const fall = p.fall || [18, 34], sway = p.sway || [3, 6], spin = p.spin || [6, 14];
    for (let i = 0; i < n; i++) {
      const el = document.createElement("div");
      el.className = "particle";
      const [fill, stroke] = colors[i % colors.length];
      el.innerHTML = `<svg viewBox="${esc(p.viewBox || "0 0 32 32")}"><path d="${esc(p.path)}" fill="${esc(fill)}" stroke="${esc(stroke)}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
      const s = rnd(size[0], size[1]);
      el.style.width = el.style.height = s + "px";
      el.style.left = rnd(0, 2560) + "px";
      el.style.setProperty("--o", rnd(op[0], op[1]).toFixed(2));
      const f = rnd(fall[0], fall[1]), w = rnd(sway[0], sway[1]);
      el.style.animationDuration = `${f}s, ${w}s`;
      el.style.animationDelay = `${-Math.random() * f}s, ${-Math.random() * w}s`;
      el.querySelector("svg").style.animationDuration = rnd(spin[0], spin[1]) + "s";
      host.appendChild(el);
    }
  }

  tick();
  loadSchedule();
  setInterval(loadSchedule, SCHEDULE_REFRESH_MS);
</script>
</body>
</html>
