      <circle cx="20" cy="20" r="1.2" fill="#5fd3b3" opacity=".25"/>
    </pattern>
    <filter id="pglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="t0" d="M40 660 L260 660 L300 620 L560 620 L600 660 L1140 660"/><path id="t1" d="M40 700 L1000 700 L1040 660"/><path id="t2" d="M880 40 L880 120 L920 160 L1120 160"/><path id="t3" d="M960 40 L960 90 L1000 130 L1140 130 L1160 110"/><path id="t4" d="M40 100 L40 40 L140 40"/><path id="t5" d="M2520 40 L2520 110 L2480 150"/><path id="t6" d="M1200 700 L2520 700"/><path id="t7" d="M1230 12 L1420 12"/><path id="t8" d="M1500 40 L1700 40 L1740 80"/><path id="t9" d="M760 470 L760 580 L800 620 L1140 620"/><path id="t10" d="M1160 560 L1160 620 L1180 640"/>
