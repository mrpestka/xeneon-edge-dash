<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 720" width="2560" height="720">
  <!-- Phosphor scene: scanlines, a soft tube vignette, and a faint raster glow. -->
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="2" fill="#000" opacity=".35"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".7"/>
    </radialGradient>
    <radialGradient id="raster" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#4dff7a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4dff7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="720" fill="url(#raster)"/>
  <!-- status line along the bottom, like a terminal footer -->
  <g fill="none" stroke="#1f8f43" stroke-width="1" opacity=".8">
    <line x1="60" y1="696" x2="1140" y2="696"/>
    <path d="M60 696 V 684"/><path d="M1140 696 V 684"/>
  </g>
  <g fill="#1f8f43" opacity=".9">
    <rect x="60" y="702" width="18" height="6"/><rect x="84" y="702" width="18" height="6"/><rect x="108" y="702" width="18" height="6"/>
    <rect x="132" y="702" width="18" height="6" opacity=".5"/><rect x="156" y="702" width="18" height="6" opacity=".3"/>
  </g>
  <rect width="2560" height="720" fill="url(#scan)"/>
  <rect width="2560" height="720" fill="url(#vignette)"/>
</svg>
