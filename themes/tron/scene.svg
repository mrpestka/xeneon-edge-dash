<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 720" width="2560" height="720">
  <!-- Tron scene: perspective grid floor, horizon glow, distant towers, light-cycle trails. -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38e0ff" stop-opacity=".9"/><stop offset="1" stop-color="#38e0ff" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="skyglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38e0ff" stop-opacity="0"/><stop offset="1" stop-color="#38e0ff" stop-opacity=".22"/>
    </linearGradient>
    <clipPath id="floor"><rect x="0" y="590" width="2560" height="130"/></clipPath>
  </defs>

  <!-- sky glow above the horizon -->
  <rect x="0" y="430" width="2560" height="160" fill="url(#skyglow)"/>

  <!-- distant towers along the horizon, kept below the clock digits -->
  <g fill="#0b2a3a" stroke="#38e0ff" stroke-width="1.5" opacity=".55">
    <rect x="740" y="500" width="60" height="90"/><rect x="812" y="462" width="36" height="128"/>
    <rect x="860" y="520" width="96" height="70"/><rect x="968" y="420" width="48" height="170"/>
    <rect x="1028" y="488" width="78" height="102"/><rect x="1118" y="446" width="40" height="144"/>
    <rect x="1170" y="528" width="100" height="62"/><rect x="1282" y="470" width="52" height="120"/>
  </g>
  <g stroke="#38e0ff" stroke-width="1" opacity=".5">
    <line x1="756" y1="520" x2="784" y2="520"/><line x1="756" y1="550" x2="784" y2="550"/>
    <line x1="978" y1="446" x2="1006" y2="446"/><line x1="978" y1="490" x2="1006" y2="490"/><line x1="978" y1="534" x2="1006" y2="534"/>
    <line x1="1128" y1="470" x2="1148" y2="470"/><line x1="1128" y1="514" x2="1148" y2="514"/>
  </g>

  <!-- horizon line -->
  <line x1="0" y1="590" x2="2560" y2="590" stroke="#9ff1ff" stroke-width="3" filter="url(#glow)"/>
  <line x1="0" y1="590" x2="2560" y2="590" stroke="#ffffff" stroke-width="1"/>

  <!-- grid floor -->
  <g clip-path="url(#floor)" stroke="url(#floorfade)" stroke-width="1.6" fill="none">
    <line x1="1280" y1="590" x2="-2400" y2="720"/>
    <line x1="1280" y1="590" x2="-2200" y2="720"/>
    <line x1="1280" y1="590" x2="-2000" y2="720"/>
    <line x1="1280" y1="590" x2="-1800" y2="720"/>
    <line x1="1280" y1="590" x2="-1600" y2="720"/>
    <line x1="1280" y1="590" x2="-1400" y2="720"/>
    <line x1="1280" y1="590" x2="-1200" y2="720"/>
    <line x1="1280" y1="590" x2="-1000" y2="720"/>
    <line x1="1280" y1="590" x2="-800" y2="720"/>
    <line x1="1280" y1="590" x2="-600" y2="720"/>
    <line x1="1280" y1="590" x2="-400" y2="720"/>
    <line x1="1280" y1="590" x2="-200" y2="720"/>
    <line x1="1280" y1="590" x2="0" y2="720"/>
    <line x1="1280" y1="590" x2="200" y2="720"/>
    <line x1="1280" y1="590" x2="400" y2="720"/>
    <line x1="1280" y1="590" x2="600" y2="720"/>
    <line x1="1280" y1="590" x2="800" y2="720"/>
    <line x1="1280" y1="590" x2="1000" y2="720"/>
    <line x1="1280" y1="590" x2="1200" y2="720"/>
    <line x1="1280" y1="590" x2="1400" y2="720"/>
    <line x1="1280" y1="590" x2="1600" y2="720"/>
    <line x1="1280" y1="590" x2="1800" y2="720"/>
    <line x1="1280" y1="590" x2="2000" y2="720"/>
    <line x1="1280" y1="590" x2="2200" y2="720"/>
    <line x1="1280" y1="590" x2="2400" y2="720"/>
    <line x1="1280" y1="590" x2="2600" y2="720"/>
    <line x1="1280" y1="590" x2="2800" y2="720"/>
    <line x1="1280" y1="590" x2="3000" y2="720"/>
    <line x1="1280" y1="590" x2="3200" y2="720"/>
    <line x1="1280" y1="590" x2="3400" y2="720"/>
    <line x1="1280" y1="590" x2="3600" y2="720"/>
    <line x1="1280" y1="590" x2="3800" y2="720"/>
    <line x1="1280" y1="590" x2="4000" y2="720"/>
    <line x1="1280" y1="590" x2="4200" y2="720"/>
    <line x1="1280" y1="590" x2="4400" y2="720"/>
    <line x1="1280" y1="590" x2="4600" y2="720"/>
    <line x1="1280" y1="590" x2="4800" y2="720"/>
    <line x1="1280" y1="590" x2="5000" y2="720"/>
    <line x1="1280" y1="590" x2="5200" y2="720"/>
    <line x1="1280" y1="590" x2="5400" y2="720"/>
    <line x1="1280" y1="590" x2="5600" y2="720"/>
    <line x1="1280" y1="590" x2="5800" y2="720"/>
    <line x1="1280" y1="590" x2="6000" y2="720"/>
    <line x1="1280" y1="590" x2="6200" y2="720"/>
    <line x1="0" y1="591" x2="2560" y2="591"/>
    <line x1="0" y1="593" x2="2560" y2="593"/>
    <line x1="0" y1="596" x2="2560" y2="596"/>
    <line x1="0" y1="601" x2="2560" y2="601"/>
    <line x1="0" y1="607" x2="2560" y2="607"/>
    <line x1="0" y1="614" x2="2560" y2="614"/>
    <line x1="0" y1="622" x2="2560" y2="622"/>
    <line x1="0" y1="632" x2="2560" y2="632"/>
    <line x1="0" y1="644" x2="2560" y2="644"/>
    <line x1="0" y1="656" x2="2560" y2="656"/>
    <line x1="0" y1="670" x2="2560" y2="670"/>
    <line x1="0" y1="686" x2="2560" y2="686"/>
    <line x1="0" y1="702" x2="2560" y2="702"/>
    <line x1="0" y1="720" x2="2560" y2="720"/>
  </g>
  <g clip-path="url(#floor)" stroke="#38e0ff" stroke-width="4" fill="none" opacity=".35" filter="url(#glow2)">
    <line x1="0" y1="720" x2="2560" y2="720"/>
  </g>

  <!-- light-cycle trails on the floor -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M-20 706 L 520 706 L 520 656 L 1180 656" stroke="#ff9a1f" stroke-width="7" opacity=".55" filter="url(#glow)"/>
    <path d="M-20 706 L 520 706 L 520 656 L 1180 656" stroke="#ffd9a8" stroke-width="2"/>
    <path d="M2580 686 L 1900 686 L 1900 626 L 1420 626" stroke="#38e0ff" stroke-width="7" opacity=".55" filter="url(#glow)"/>
    <path d="M2580 686 L 1900 686 L 1900 626 L 1420 626" stroke="#d9fbff" stroke-width="2"/>
  </g>
  <!-- cycles at the trail heads -->
  <g>
    <rect x="1180" y="646" width="34" height="20" rx="6" fill="#ff9a1f" filter="url(#glow)"/><rect x="1186" y="650" width="22" height="12" rx="4" fill="#fff3e0"/>
    <rect x="1386" y="616" width="34" height="20" rx="6" fill="#38e0ff" filter="url(#glow)"/><rect x="1392" y="620" width="22" height="12" rx="4" fill="#eaffff"/>
  </g>


  <!-- passing light cycles: a distant one on the horizon, a nearer one on the floor (SMIL, no script) -->
  <g>
    <!-- distant, cyan, left to right -->
    <g transform="translate(-900 0)">
      <animateTransform id="lc1" attributeName="transform" type="translate" from="-900 0" to="3500 0" dur="9s" begin="2s; lc1.end+26s" fill="remove"/>
      <defs><linearGradient id="tr1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38e0ff" stop-opacity="0"/><stop offset="1" stop-color="#38e0ff" stop-opacity=".95"/></linearGradient></defs>
      <rect x="0" y="582" width="700" height="4" fill="url(#tr1)" filter="url(#glow)"/>
      <rect x="0" y="583" width="700" height="2" fill="url(#tr1)"/>
      <rect x="696" y="576" width="26" height="14" rx="4" fill="#38e0ff" filter="url(#glow)"/>
      <rect x="700" y="579" width="18" height="8" rx="3" fill="#eaffff"/>
    </g>
    <!-- nearer, orange, right to left, lower on the floor -->
    <g transform="translate(3600 0)">
      <animateTransform id="lc2" attributeName="transform" type="translate" from="3600 0" to="-1300 0" dur="7s" begin="17s; lc2.end+41s" fill="remove"/>
      <defs><linearGradient id="tr2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ff9a1f" stop-opacity="0"/><stop offset="1" stop-color="#ff9a1f" stop-opacity=".9"/></linearGradient></defs>
      <rect x="40" y="636" width="900" height="6" fill="url(#tr2)" filter="url(#glow)"/>
      <rect x="40" y="637" width="900" height="3" fill="url(#tr2)"/>
      <rect x="0" y="626" width="44" height="22" rx="7" fill="#ff9a1f" filter="url(#glow)"/>
      <rect x="6" y="631" width="30" height="12" rx="5" fill="#fff3e0"/>
    </g>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#38e0ff" stroke-width="2" fill="none" opacity=".7">
    <path d="M30 70 V30 H70"/><path d="M2530 70 V30 H2490"/>
  </g>
</svg>
